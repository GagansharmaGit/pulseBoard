services:
  # ---------------------------------------------
  # Backend API (Node.js Express)
  # ---------------------------------------------
  - type: web
    name: pulseboard-api
    env: node
    buildCommand: npm install -g pnpm@latest && pnpm config set side-effects-cache false && pnpm install --no-frozen-lockfile && pnpm build:api
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      # The variables below will be marked as "missing" in the Render Dashboard
      # until you paste your actual secrets into them.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------
  # Frontend SPA (Vite + React)
  # ---------------------------------------------
  - type: web
    name: pulseboard-web
    env: static
    buildCommand: npm install -g pnpm@latest && pnpm config set side-effects-cache false && pnpm install --no-frozen-lockfile && pnpm build:web
    staticPublishPath: apps/web/dist
    envVars:
      # The variables below will be marked as "missing" in the Render Dashboard
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      # This forces all traffic (like /dashboard/polls/new) to go to index.html
      # which is strictly required for React Router to work on a static host!
      - type: rewrite
        source: /*
        destination: /index.html
