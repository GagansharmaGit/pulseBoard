services:
  postgres:
    image: postgres:16-alpine
    container_name: gpolls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpolls
      POSTGRES_PASSWORD: gpolls_secret
      POSTGRES_DB: gpolls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpolls -d gpolls"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gpolls-redis
    restart: unless-stopped
    command: redis-server --requirepass gpolls_redis_secret --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "gpolls_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
